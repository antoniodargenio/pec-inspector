[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pec-inspector"
dynamic = ["version"]          # from the git tag vX.Y.Z (setuptools-scm)
description = "Read-only download and verification of Italian PEC / REM messages: receipts, signatures, trust chains, OCSP/CRL"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE.md"]
dependencies = ["cryptography>=45"]
keywords = ["pec", "rem", "certified-email", "imap", "smime", "cades", "pades", "ocsp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Communications :: Email",
    "Topic :: Security :: Cryptography",
]

[project.optional-dependencies]
dns = ["dnspython>=2.4"]     # SRV / MX based IMAP auto-discovery
xsd = ["lxml>=5"]            # XSD validation of REM evidence
pdf = ["reportlab>=4"]          # --thread-pdf: conversations as A4 PDF
all = ["dnspython>=2.4", "lxml>=5", "reportlab>=4"]

[project.scripts]
pec-inspector = "pec_inspector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
fallback_version = "0+unknown"   # e.g. a source archive without git metadata
